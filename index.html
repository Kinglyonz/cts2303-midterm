<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--ink:#2d3b45;--mute:#6b7780;--line:#c7cdd1;--soft:#f5f5f5;--blue:#0b5cad;--amber:#8a5a00;--amberbg:#fff6e0;--code:#f1f3f5}
*{box-sizing:border-box}html{background:#fff}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;font-weight:600;margin:0 0 10px}h2{font-size:18px;font-weight:600;margin:20px 0 8px}
label.f{display:block;margin:10px 0;font-weight:600}label.f input{display:block;width:100%;max-width:420px;padding:8px;border:1px solid var(--line);border-radius:4px;font:inherit;margin-top:4px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.copy{padding:5px 12px;font-size:13px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:24px;align-items:start}
.side{position:sticky;top:12px;border:1px solid var(--line);border-radius:4px;padding:12px;font-size:14px}
.timer{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.dots a{display:block;text-align:center;font-size:12px;padding:2px 0;border:1px solid var(--line);border-radius:3px;color:var(--ink);text-decoration:none}
.dots a.done{background:var(--blue);border-color:var(--blue);color:#fff}
.q{border:1px solid var(--line);border-radius:4px;margin-bottom:16px;overflow:hidden}
.qh{display:flex;justify-content:space-between;gap:12px;background:var(--soft);border-bottom:1px solid var(--line);padding:8px 12px;font-weight:600;font-size:14px}
.qb{padding:12px}.qb p{margin:0 0 10px}
pre{background:var(--code);border:1px solid #dfe3e6;border-radius:3px;padding:10px;margin:0 0 8px;overflow-x:auto;font:12.5px/1.45 Consolas,"Cascadia Mono",Menlo,monospace;white-space:pre-wrap;word-break:break-word}
label.opt{display:flex;gap:10px;padding:8px;border-top:1px solid #eceef0;cursor:pointer;align-items:flex-start}
label.opt:first-of-type{border-top:0}label.opt input{margin-top:4px;flex:none}label.opt p{margin:0}
.note{border:1px solid var(--line);border-left:4px solid var(--blue);padding:10px 12px;border-radius:3px;margin:12px 0}
.note p{margin:0 0 6px}.note ol{margin:6px 0;padding-left:22px}.pick{border-top:1px solid #eceef0;padding-top:8px;font-weight:600}.pick p{display:inline;margin:0;font-weight:400}.pick div{display:inline}.note.warn{border-left-color:var(--amber);background:var(--amberbg)}
@media (max-width:760px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}}
</style></head><body><div class="wrap" id="app"></div>
<script id="data" type="application/json">[{"key": "p1", "n": 1, "title": "Part 1: Multiple Choice", "minutes": 50, "items": [{"type": "mc", "points": 2.5, "html": "<p>An admin wants one browser based tool to manage several Windows servers, without installing the RSAT consoles on a workstation. Which tool fits?<\/p>", "choices": ["<p>Windows Admin Center<\/p>", "<p>Hyper-V Manager<\/p>", "<p>Event Viewer<\/p>", "<p>Group Policy Management Console<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>An admin is on a locked down workstation that has only a web browser, and needs to run PowerShell commands against Azure. Which interface fits best?<\/p>", "choices": ["<p>Azure Cloud Shell<\/p>", "<p>Server Manager<\/p>", "<p>sconfig<\/p>", "<p>The Performance Monitor console<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>An admin is installing Windows Server at a branch. It needs a smaller attack surface and fewer patches, and the admin will manage it remotely. Which install option fits best?<\/p>", "choices": ["<p>Server with Desktop Experience<\/p>", "<p>Windows 11 Enterprise<\/p>", "<p>Server Core<\/p>", "<p>A workgroup client<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Which of these is a Windows Server feature, not a server role?<\/p>", "choices": ["<p>BitLocker Drive Encryption<\/p>", "<p>DNS Server<\/p>", "<p>DHCP Server<\/p>", "<p>Active Directory Domain Services<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>On Server Core, which built in tool gives a text menu for setting the computer name, network settings and domain join?<\/p>", "choices": ["<p>msconfig<\/p>", "<p>regedit<\/p>", "<p>ncpa.cpl<\/p>", "<p>sconfig<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Which command lists only the services that are stopped?<\/p>", "choices": ["<p>Get-Service | Sort-Object Status<\/p>", "<p>Get-Service | Select-Object -First 1<\/p>", "<p>Get-Service | Where-Object Status -eq 'Stopped'<\/p>", "<p>Get-Process | Where-Object Status -eq 'Stopped'<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Why can Get-Process | Sort-Object CPU sort by CPU without any text parsing?<\/p>", "choices": ["<p>Sort-Object reads the columns off the screen<\/p>", "<p>PowerShell passes objects with properties down the pipeline<\/p>", "<p>CPU is the only property Get-Process returns<\/p>", "<p>Windows stores process data in a CSV file<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>An admin wants to log CPU and memory counters overnight and review them in the morning. What should the admin create in Performance Monitor?<\/p>", "choices": ["<p>An event subscription<\/p>", "<p>A data collector set<\/p>", "<p>A resource group<\/p>", "<p>A scheduled restart<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>An admin needs to run the same PowerShell command on 10 servers at once. Which cmdlet fits?<\/p>", "choices": ["<p>Enter-PSSession<\/p>", "<p>Invoke-Command<\/p>", "<p>Start-Process<\/p>", "<p>Get-Command<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A company rents virtual machines in Azure and still patches the guest operating system itself. Which service model is this?<\/p>", "choices": ["<p>Platform as a Service<\/p>", "<p>Software as a Service<\/p>", "<p>On-premises hosting<\/p>", "<p>Infrastructure as a Service<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A developer deploys code to Azure App Service, and Microsoft patches the operating system and the runtime. Which service model is this?<\/p>", "choices": ["<p>Platform as a Service<\/p>", "<p>Infrastructure as a Service<\/p>", "<p>Software as a Service<\/p>", "<p>On-premises hosting<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A company keeps some servers in its own building and connects them to resources in Azure. Which deployment model is this?<\/p>", "choices": ["<p>Public cloud<\/p>", "<p>Hybrid cloud<\/p>", "<p>Private cloud<\/p>", "<p>Community cloud<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Several Azure resources belong to one project and must be managed and deleted together. What should hold them?<\/p>", "choices": ["<p>A resource group<\/p>", "<p>A virtual network<\/p>", "<p>An availability set<\/p>", "<p>A storage account<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A host has the address 192.168.10.130/26. What is its network address?<\/p>", "choices": ["<p>192.168.10.0<\/p>", "<p>192.168.10.130<\/p>", "<p>192.168.10.192<\/p>", "<p>192.168.10.128<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>How many usable host addresses does a /26 subnet have?<\/p>", "choices": ["<p>64<\/p>", "<p>30<\/p>", "<p>62<\/p>", "<p>126<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A server can ping its own address and every host on its subnet, but it cannot reach any other subnet. Which setting should the admin check first?<\/p>", "choices": ["<p>The DNS suffix<\/p>", "<p>The DHCP lease length<\/p>", "<p>The default gateway<\/p>", "<p>The MAC address<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A Windows computer shows the address 169.254.33.7. What does that tell the admin?<\/p>", "choices": ["<p>It could not reach a DHCP server and assigned itself an address<\/p>", "<p>It got that address from a DHCP reservation<\/p>", "<p>It is using an IPv6 tunnel<\/p>", "<p>It has a public address from the ISP<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>What is the correct order of the DHCP lease process?<\/p>", "choices": ["<p>Discover, Request, Offer, Acknowledge<\/p>", "<p>Request, Offer, Discover, Acknowledge<\/p>", "<p>Discover, Offer, Request, Acknowledge<\/p>", "<p>Offer, Discover, Request, Acknowledge<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Clients are on a subnet with no DHCP server, and the router does not forward broadcasts. What gets their requests to the DHCP server?<\/p>", "choices": ["<p>A DNS forwarder<\/p>", "<p>A DHCP relay agent<\/p>", "<p>A CNAME record<\/p>", "<p>A global catalog<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A network printer must always get the same address from DHCP, tied to its MAC address. What should the admin create?<\/p>", "choices": ["<p>An exclusion<\/p>", "<p>A reservation<\/p>", "<p>A second scope<\/p>", "<p>A superscope<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Which kind of IPv6 address starts with fe80 and works only on the local link?<\/p>", "choices": ["<p>Global unicast<\/p>", "<p>Multicast<\/p>", "<p>Link-local<\/p>", "<p>Loopback<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Email sent to contoso.com is not arriving. Which DNS record type should the admin check first?<\/p>", "choices": ["<p>MX<\/p>", "<p>PTR<\/p>", "<p>CNAME<\/p>", "<p>SRV<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Which DNS record type do domain clients use to find a domain controller?<\/p>", "choices": ["<p>MX<\/p>", "<p>PTR<\/p>", "<p>SRV<\/p>", "<p>TXT<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A branch DNS server needs a full, read-only copy of a zone that lives on another DNS server. Which zone type fits?<\/p>", "choices": ["<p>Primary zone<\/p>", "<p>Stub zone<\/p>", "<p>Reverse lookup zone<\/p>", "<p>Secondary zone<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>An admin wants a DNS server to send every outside query to one specific upstream DNS server. What should the admin configure?<\/p>", "choices": ["<p>Root hints<\/p>", "<p>Zone transfers<\/p>", "<p>A forwarder<\/p>", "<p>Scavenging<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A client keeps going to a server's old address after the DNS record was changed. Which command clears that client's DNS cache?<\/p>", "choices": ["<p>ipconfig /renew<\/p>", "<p>ipconfig /registerdns<\/p>", "<p>ipconfig /release<\/p>", "<p>ipconfig /flushdns<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>What does DNSSEC add to DNS?<\/p>", "choices": ["<p>Encryption of every DNS query<\/p>", "<p>Automatic IP addresses for clients<\/p>", "<p>A second copy of Active Directory<\/p>", "<p>Digital signatures that let a resolver verify an answer is genuine<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Which Active Directory structure is the security boundary?<\/p>", "choices": ["<p>The organizational unit<\/p>", "<p>The site<\/p>", "<p>The security group<\/p>", "<p>The forest<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A branch office has poor physical security but needs a local domain controller for logons. Which option fits best?<\/p>", "choices": ["<p>A read-only domain controller<\/p>", "<p>A writable domain controller that holds the FSMO roles<\/p>", "<p>A second DHCP server<\/p>", "<p>A secondary DNS zone only<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Which FSMO role is the time source for its domain and gets password changes first?<\/p>", "choices": ["<p>PDC Emulator<\/p>", "<p>RID Master<\/p>", "<p>Schema Master<\/p>", "<p>Infrastructure Master<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>What does a Global Catalog server hold so users can search across domains in a forest?<\/p>", "choices": ["<p>A full writable copy of every domain<\/p>", "<p>A partial copy of every object in the forest<\/p>", "<p>Only the DNS zones<\/p>", "<p>Only the FSMO roles<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Why does an admin create Active Directory sites?<\/p>", "choices": ["<p>To organize users by department<\/p>", "<p>To set password rules for a group<\/p>", "<p>To match the physical network, so replication and logons use the right links<\/p>", "<p>To publish web pages in IIS<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>How does Active Directory handle a normal change, such as a new user, in a domain with several writable domain controllers?<\/p>", "choices": ["<p>Multi-master: any writable domain controller can take the change, and it replicates to the others<\/p>", "<p>Only the PDC Emulator can take the change<\/p>", "<p>Each domain controller keeps its own separate users<\/p>", "<p>The change must be made in Azure first<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Which Microsoft tool keeps on-premises Active Directory users in sync with Microsoft Entra ID (Azure AD)?<\/p>", "choices": ["<p>Microsoft Entra Connect<\/p>", "<p>IPAM<\/p>", "<p>Windows Server Update Services<\/p>", "<p>Performance Monitor<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>An admin wants to link a Group Policy to the Sales users and let a Sales lead reset only their passwords. What should the admin create?<\/p>", "choices": ["<p>A distribution group<\/p>", "<p>A site<\/p>", "<p>An organizational unit<\/p>", "<p>A forest<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Which group type can be given permissions on a shared folder?<\/p>", "choices": ["<p>Distribution group<\/p>", "<p>Organizational unit<\/p>", "<p>Site link<\/p>", "<p>Security group<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>In the AGDLP strategy, into which kind of group do user accounts go first?<\/p>", "choices": ["<p>Global group<\/p>", "<p>Domain local group<\/p>", "<p>Universal group<\/p>", "<p>Local group on the file server<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>What is the main benefit of a group Managed Service Account (gMSA)?<\/p>", "choices": ["<p>The domain changes its password automatically, and several servers can use it<\/p>", "<p>It is a normal user account whose password never expires<\/p>", "<p>It is a Domain Admin by default<\/p>", "<p>It works only on one workstation<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A help desk team must reset passwords in one OU without getting broader admin rights. What should the admin do?<\/p>", "choices": ["<p>Add the team to Domain Admins<\/p>", "<p>Add the team to Enterprise Admins<\/p>", "<p>Run the Delegation of Control wizard on that OU<\/p>", "<p>Give the team the Administrator password<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>An admin needs to create 300 users from a spreadsheet. Which approach fits best?<\/p>", "choices": ["<p>Import-Csv piped into New-ADUser<\/p>", "<p>Get-ADUser piped into Export-Csv<\/p>", "<p>Set-ADUser with no input file<\/p>", "<p>ipconfig /all<\/p>"]}]}, {"key": "p2", "n": 2, "title": "Part 2: Hands-on Lab", "minutes": 30, "items": [{"type": "text", "points": 2.5, "html": "<p>Part 2 is hands-on. You use a CourseLabs lab only for its terminal. The lab is called Win 07: Building a Domain, but this is your real exam, and every task is on this page. Ignore the lab's guide and its Continue button.<\/p><p>1. Open courselabs.io, go to the course Windows Administration from the Command Line, and open the lab named Win 07: Building a Domain. Keep the lab in one tab only.<\/p><p>2. Wait until the terminal shows its prompt, PS /root&gt;. Then click Copy on the setup command below. It already has your name in it, so do not change it. Click inside the terminal, paste with Ctrl + Shift + V (Cmd + V on a Mac), and press Enter.<\/p><p>3. Wait for the words SETUP DONE, about 20 seconds. Your name now shows in the prompt.<\/p><p>4. Do the tasks in order. For each one, click Copy, paste it into the terminal, press Enter, wait for it to finish, and pick the answer that matches what your terminal shows. Never retype a command. If a command looks wrong or fails, click Copy and paste it again. Running a task twice is fine.<\/p><pre><code>; ~/exercises/identify.ps1 \"__NAME__\" *&gt; $null; . $PROFILE; bash ~/exercises/prepare.sh | Out-Null; bash ~/exercises/provision-domain.sh | Out-Null; bash ~/exercises/start-dc.sh | Out-Null; . ~/exercises/ad.ps1 *&gt; $null; docker exec dc1 samba-tool ou add 'OU=Sales' *&gt; $null; docker exec dc1 samba-tool user create maria --random-password --userou='OU=Sales' *&gt; $null; \"SETUP DONE\"  #<\/code><\/pre>"}, {"type": "mc", "points": 6.0, "html": "<p>TASK 1, IP addressing. This prints this machine's address on the lab network. What is the network address of this subnet, and how many usable host addresses does it have?<\/p><pre><code>; \"=== TASK 1 ===\" | Tee-Object -Append ~/midterm.txt; ip -4 -o addr show | Select-String '10\\.60\\.' | ForEach-Object { ($_.Line -split '\\s+')[3] } | Tee-Object -Append ~/midterm.txt  #<\/code><\/pre>", "choices": ["<p>10.60.0.5, with 254 usable hosts<\/p>", "<p>10.60.0.0, with 254 usable hosts<\/p>", "<p>10.60.0.0, with 256 usable hosts<\/p>", "<p>10.0.0.0, with 65,534 usable hosts<\/p>"]}, {"type": "mc", "points": 6.0, "html": "<p>TASK 2, DNS. A domain laptop knows only the domain name. This is the DNS query it uses to find a domain controller. What does the answer tell the laptop?<\/p><pre><code>; \"=== TASK 2 ===\" | Tee-Object -Append ~/midterm.txt; dig +short SRV _ldap._tcp.dc._msdcs.corp.harbor.test '@10.60.0.10' | Tee-Object -Append ~/midterm.txt  #<\/code><\/pre>", "choices": ["<p>Send mail to dc1.corp.harbor.test with priority 389<\/p>", "<p>dc1.corp.harbor.test is an alias for a server on port 100<\/p>", "<p>Contact dc1.corp.harbor.test on port 389 for LDAP<\/p>", "<p>Ask a DHCP server for the address of dc1<\/p>"]}, {"type": "mc", "points": 6.0, "html": "<p>TASK 3, Active Directory. This shows who holds the PDC Emulator role. Read the owner line from left to right. Which server holds the role, and which site is that server in?<\/p><pre><code>; \"=== TASK 3 ===\" | Tee-Object -Append ~/midterm.txt; docker exec dc1 samba-tool fsmo show | Select-String 'PdcEmulation' | ForEach-Object { $_.Line } | Tee-Object -Append ~/midterm.txt  #<\/code><\/pre>", "choices": ["<p>NTDS Settings, in the site Servers<\/p>", "<p>corp, in the site harbor<\/p>", "<p>Default-First-Site-Name, in the site Configuration<\/p>", "<p>DC1, in the site Default-First-Site-Name<\/p>"]}, {"type": "mc", "points": 6.0, "html": "<p>TASK 4, AD objects. Setup created an OU named Sales and a user named maria. This prints the user's distinguished name. What does that name tell you?<\/p><pre><code>; \"=== TASK 4 ===\" | Tee-Object -Append ~/midterm.txt; Get-LabObject '(sAMAccountName=maria)' | ForEach-Object { $_.DistinguishedName } | Tee-Object -Append ~/midterm.txt  #<\/code><\/pre>", "choices": ["<p>maria is in the Sales OU of the domain corp.harbor.test<\/p>", "<p>maria is in the default Users container<\/p>", "<p>maria is a member of a security group named Sales<\/p>", "<p>maria is in a forest named Sales<\/p>"]}, {"type": "mc", "points": 6.0, "html": "<p>TASK 5, PowerShell. The first command returns the person accounts. Where-Object removes krbtgt, and Measure-Object counts what is left. What does it print, and why?<\/p><pre><code>; \"=== TASK 5 ===\" | Tee-Object -Append ~/midterm.txt; Get-LabObject '(objectCategory=person)' | Where-Object Name -ne 'krbtgt' | Measure-Object | ForEach-Object { \"Count: $($_.Count)\" } | Tee-Object -Append ~/midterm.txt  #<\/code><\/pre>", "choices": ["<p>Count: 4, because Where-Object only sorts the objects<\/p>", "<p>Count: 3, because Administrator, Guest and maria are left<\/p>", "<p>Count: 2, because a new domain has only two accounts<\/p>", "<p>Count: 1, because Measure-Object returns one row<\/p>"]}, {"type": "file", "points": 20.0, "html": "<p>FINAL STEP. Click Copy, paste this into the terminal and press Enter. It prints your whole record. Take one screenshot that shows the Student line, the Machine line and all five tasks (Windows: Win + Shift + S. Mac: Cmd + Shift + 4). Save the screenshot. You will attach it to your email at the end. This screenshot is worth 20 points.<\/p><pre><code>; [Console]::Clear(); \"Student: __NAME__\"; \"Machine $(Get-Content /proc/sys/kernel/hostname)  $((Get-Date).ToUniversalTime().ToString('HH:mm')) UTC\"; Get-Content ~/midterm.txt  #<\/code><\/pre>"}]}]</script>
<script>
const Q=JSON.parse(document.getElementById('data').textContent),KEY='cts2303-midterm',TO='khalillyons@gmail.com',DUE='5:50 PM',L='ABCD';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const rich=h=>{const d=el('div');d.innerHTML=h;return d};
const app=document.getElementById('app');let tick=null;
let S={first:'',last:'',email:'',view:'home',p1:{ans:{},order:{},end:0,done:0},p2:{ans:{},order:{},end:0,done:0}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const who=()=>(S.first+' '+S.last).replace(/[^\p{L}\p{M}0-9 .-]/gu,'').trim();
function fill(box,copy){box.querySelectorAll('pre').forEach(p=>{p.textContent=p.textContent.split('__NAME__').join(who());if(!copy)return;const b=el('button','btn copy','Copy');b.type='button';b.onclick=()=>{const t=p.textContent,ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)},bad=()=>{const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected: press Ctrl + C'};navigator.clipboard?navigator.clipboard.writeText(t).then(ok,bad):bad()};p.after(b)})}
function shuffle(q){const s=S[q.key];q.items.forEach((it,i)=>{if(it.type==='mc'&&!s.order[i]){const o=[0,1,2,3];for(let j=3;j>0;j--){const k=Math.floor(Math.random()*(j+1));[o[j],o[k]]=[o[k],o[j]]}s.order[i]=o}})}
const answers=q=>{const s=S[q.key],a=[];let n=0;q.items.forEach((it,i)=>{if(it.type==='mc'){n++;a.push(n+(s.ans[i]===undefined?'-':L[s.ans[i]]))}});return a.join(' ')};
function record(){const l=['CTS 2303 Midterm','First name: '+S.first,'Last name: '+S.last,'Email: '+S.email];Q.forEach(q=>{const s=S[q.key];if(s.done){l.push('Part '+q.n+' started: '+new Date(s.end-q.minutes*60000).toLocaleString(),'Part '+q.n+' finished: '+new Date(s.done).toLocaleString(),'Part '+q.n+' answers: '+answers(q))}else l.push('Part '+q.n+' answers: not submitted')});return l.join('\r\n')}
const fname=()=>'Midterm-'+(S.last+'-'+S.first).replace(/[^A-Za-z0-9-]+/g,'')+'.txt';
function sendbox(){const body=record(),subject='CTS2303 Midterm - '+S.first+' '+S.last,w=el('div','note');w.append(el('p','','Send one email by '+DUE+'. Do these three steps:'));
const s1=el('p','');s1.append(el('b','','Step 1. '),'Click Download my answers. You get one file, '+fname()+'. It holds both parts.');const r1=el('div','row'),dl=el('button','btn','Download my answers');dl.onclick=()=>{const u=URL.createObjectURL(new Blob([body],{type:'text/plain'})),x=el('a');x.href=u;x.download=fname();document.body.append(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);dl.textContent='Downloaded: '+fname()};r1.append(dl);
const s2=el('p','');s2.append(el('b','','Step 2. '),'Find your terminal screenshot.');
const s3=el('p','');s3.append(el('b','','Step 3. '),'Click Open email. Attach your answer file and your screenshot, then click Send.');const r3=el('div','row'),m=el('a','btn','Open email');m.href='mailto:'+TO+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent('Attach your answer file and your screenshot to this email.\r\n\r\n'+body);r3.append(m);
const c=el('button','btn alt','Copy email address');c.type='button';c.onclick=()=>{const ok=()=>{c.textContent='Copied'},bad=()=>{c.textContent=TO};navigator.clipboard?navigator.clipboard.writeText(TO).then(ok,bad):bad()};r3.append(c);
w.append(s1,r1,s2,s3,r3,el('p','','If Open email does nothing: open your email yourself, send to '+TO+', use the subject '+subject+', and attach the same two files.'),el('p','','Do not turn the file into a PDF or a photo. Send it as it downloaded.'));return w}
function render(){clearInterval(tick);app.textContent='';scrollTo(0,0);if(S.view==='home')return home();const q=Q.find(x=>x.key===S.view);if(S[q.key].done)return finish(q);take(q)}
function home(){app.append(el('h1','','CTS 2303 Midterm'),el('p','','Windows Server Administration, Chapters 1 to 7, 150 points. Keep your camera on in Zoom. Your score stays hidden until your instructors release it.'),el('p','','Part 1 is 40 multiple choice questions, 100 points, '+Q[0].minutes+' minutes. Part 2 is 5 tasks in a live CourseLabs terminal plus one screenshot, 50 points, '+Q[1].minutes+' minutes. There is no essay. You pick an answer for every question. Do Part 1 first, and do not open the lab until you start Part 2.'),el('p','','When you finish, you send one email to '+TO+' by '+DUE+', with two attachments: one answer file and one screenshot. This page walks you through it at the end.'));
const fld=(t,v,ty,ph)=>{const l=el('label','f',t),i=el('input');i.value=v;if(ty)i.type=ty;if(ph)i.placeholder=ph;l.append(i);app.append(l);return i};const fi=fld('First name',S.first),la=fld('Last name',S.last),mi=fld('School email',S.email,'email','you@mymdc.net');const w=el('div','note warn');w.hidden=true;app.append(w);
const r=el('div','row');Q.forEach(q=>{if(S[q.key].done){r.append(el('span','',q.title+': locked. '));return}const b=el('button','btn','Start '+q.title);b.onclick=()=>{const f=fi.value.trim(),a=la.value.trim(),e=mi.value.trim();if(!f||!a||!/^\S+@\S+\.\S+$/.test(e)){w.textContent='Enter your first name, last name and school email first.';w.hidden=false;return}S.first=f;S.last=a;S.email=e;const s=S[q.key];if(!s.end)s.end=Date.now()+q.minutes*60000;shuffle(q);S.view=q.key;save();render()};r.append(b)});app.append(r,el('p','','The clock starts when you click, and it keeps running if you close this page.'));if(S.p1.done||S.p2.done)app.append(sendbox())}
function take(q){const s=S[q.key];app.append(el('h1','',q.title),el('p','',S.first+' '+S.last+', '+S.email),el('div','note','')); app.lastChild.append(el('p','',q.n===1?'Pick the best answer for each of the 40 questions. Each is worth 2.5 points. You can go back and change an answer until you click Submit at the bottom.':'Follow the instructions first. For each task, run the command in the lab, then pick the answer that matches what your terminal shows. Each task is worth 6 points. The final step is a screenshot worth 20 points.'));const lay=el('div','layout'),main=el('div'),side=el('div','side');let n=0;
q.items.forEach((it,i)=>{const c=el('div','q');c.id='q'+i;const h=el('div','qh'),b=el('div','qb');b.append(rich(it.html));fill(b,true);if(it.type==='text'){h.append(el('span','','Instructions'));c.append(h,b);main.append(c);return}
n++;h.append(el('span','','Question '+n),el('span','',it.points+' pts'));if(it.type==='mc')s.order[i].forEach(o=>{const l=el('label','opt'),r=el('input');r.type='radio';r.name=q.key+i;r.checked=s.ans[i]===o;r.onchange=()=>{s.ans[i]=o;save();dots()};l.append(r,rich(it.choices[o]));b.append(l)});c.append(h,b);main.append(c)});
const st=el('button','btn','Submit '+q.title);st.onclick=()=>{const miss=q.items.filter((it,i)=>it.type==='mc'&&s.ans[i]===undefined).length;const o=document.getElementById('cf');if(o)o.remove();const f=()=>{s.done=Date.now();save();render()};const c=el('div','note warn');c.id='cf';c.append(el('p','',(miss?miss+' question(s) have no answer. ':'')+'Once you submit, you cannot change your answers.'));const b=el('button','btn','Yes, submit');b.onclick=f;c.append(b);main.append(c);c.scrollIntoView({block:'center'})};main.append(st);
const t=el('div','timer');side.append(el('div','','Time left:'),t);const dbox=el('div','dots');side.append(dbox);
function dots(){dbox.textContent='';let m=0;q.items.forEach((it,i)=>{if(it.type!=='mc')return;m++;const a=el('a',s.ans[i]!==undefined?'done':'',m);a.href='#q'+i;dbox.append(a)})}
const show=()=>{const left=Math.max(0,Math.round((s.end-Date.now())/1000));t.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left){s.done=Date.now();save();render()}};show();dots();tick=setInterval(show,1000);lay.append(main,side);app.append(lay)}
function finish(q){const s=S[q.key];app.append(el('h1','',q.title+': locked'));
if(q.n===1){const w=el('div','note warn');w.append(el('p','','Part 1 is saved in this browser. Do not email anything yet. Click Back to the start, then Start Part 2.'));app.append(w)}else{const w=el('div','note warn');w.append(el('p','','Part 2 is saved. You are not done until you send the email below.'));app.append(w,sendbox())}
const r=el('div','row'),b=el('button','btn'+(q.n===1?'':' alt'),'Back to the start');b.onclick=()=>{S.view='home';save();render()};r.append(b);app.append(r,el('h2','','Your submitted answers (locked)'));let k=0;q.items.forEach((it,i)=>{if(it.type!=='mc')return;k++;const c=el('div','q'),h=el('div','qh'),bd=el('div','qb'),pk=el('div','pick');h.append(el('span','','Question '+k));bd.append(rich(it.html));fill(bd,false);pk.append('Your answer: ');if(s.ans[i]===undefined)pk.append('No answer');else pk.append(rich(it.choices[s.ans[i]]));bd.append(pk);c.append(h,bd);app.append(c)});app.append(el('p','','You will not see a score today.'))}
render();
</script></body></html>
